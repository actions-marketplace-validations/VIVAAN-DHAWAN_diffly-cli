[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "diffly-cli"
version = "1.1.1"
description = "Deterministic triage for large GitHub pull requests — blast radius, risk flags, and a PASS/QUARANTINE/BLOCK verdict"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Vivaan Dhawan" }]
license = { file = "LICENSE" }
keywords = [
  "github",
  "pull-request",
  "code-review",
  "blast-radius",
  "static-analysis",
  "tree-sitter",
  "risk",
  "cli",
  "github-action",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
]

dependencies = [
  "rich>=13.9",
  "tree-sitter>=0.25",
  "tree-sitter-language-pack>=1.10",
  "openai>=1.0",
]

[project.urls]
Homepage = "https://github.com/VIVAAN-DHAWAN/diffly-cli"
Repository = "https://github.com/VIVAAN-DHAWAN/diffly-cli"
Documentation = "https://github.com/VIVAAN-DHAWAN/diffly-cli/tree/main/docs"
Changelog = "https://github.com/VIVAAN-DHAWAN/diffly-cli/blob/main/CHANGELOG.md"
Issues = "https://github.com/VIVAAN-DHAWAN/diffly-cli/issues"
"GitHub Action" = "https://github.com/VIVAAN-DHAWAN/diffly-cli#github-action"

[project.scripts]
diffly = "diffly_cli.cli:main"
diffly-cli = "diffly_cli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "PyYAML>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/diffly_cli"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
